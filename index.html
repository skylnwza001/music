<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonWave Music Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#1DB954',
                            neon: '#00f3ff',
                            purple: '#9d00ff',
                            dark: '#0f0f15',
                            card: '#181824'
                        }
                    },
                    boxShadow: {
                        'neon-glow': '0 0 20px rgba(0, 243, 255, 0.35)',
                        'purple-glow': '0 0 25px rgba(157, 0, 255, 0.4)'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #0b0b10;
            background-image: 
                radial-gradient(at 10% 10%, rgba(157, 0, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(0, 243, 255, 0.15) 0px, transparent 50%);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #12121c;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3e;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f3ff;
        }
        .glass-panel {
            background: rgba(24, 24, 36, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Rotating Record Animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 18s linear infinite;
        }
        .paused {
            animation-play-state: paused !important;
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between pb-6">

    <!-- Header & Search Bar -->
    <header class="w-full max-w-4xl mx-auto p-4 sm:p-6">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-purple to-brand-neon flex items-center justify-center shadow-neon-glow">
                    <i class="fa-solid font-bold fa-compact-disc text-xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-neon to-brand-purple">
                    NeonWave <span class="text-xs px-2 py-0.5 rounded border border-cyan-500/30 text-cyan-400 font-normal">YT Music</span>
                </h1>
            </div>
            <span class="text-xs text-gray-400 bg-white/5 px-3 py-1 rounded-full border border-white/10 hidden sm:inline-block">
                <i class="fa-solid fa-bolt text-yellow-400 mr-1"></i> Vercel Ready
            </span>
        </div>

        <!-- YouTube Link/ID Search Form -->
        <form id="searchForm" class="glass-panel p-2 sm:p-3 rounded-2xl flex flex-col sm:flex-row gap-2 shadow-lg">
            <div class="relative flex-1 flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400"></i>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="วางลิงก์ YouTube (URL) หรือ ID วิดีโอ..."
                    class="w-full pl-11 pr-4 py-2.5 bg-black/40 border border-white/10 rounded-xl text-sm text-white placeholder-gray-400 focus:outline-none focus:border-cyan-400 transition"
                    required
                >
            </div>
            <button 
                type="submit" 
                class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition duration-200 flex items-center justify-center gap-2 shadow-neon-glow active:scale-95"
            >
                <i class="fa-solid fa-play"></i>
                <span>ดึงเพลง / เล่น</span>
            </button>
        </form>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-12 gap-6 items-start flex-1">

        <!-- Player Card Section -->
        <section class="md:col-span-7 flex flex-col items-center">
            <div class="glass-panel w-full rounded-3xl p-6 flex flex-col items-center shadow-purple-glow relative overflow-hidden">
                
                <!-- Decorative background elements -->
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Album Cover Art with Spinning Vinyl Style -->
                <div class="relative group my-4">
                    <div id="coverContainer" class="w-52 h-52 sm:w-64 sm:h-64 rounded-full p-2 bg-gradient-to-tr from-cyan-500/40 via-purple-500/40 to-pink-500/40 shadow-2xl relative flex items-center justify-center">
                        <img 
                            id="trackCover" 
                            src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&auto=format&fit=crop" 
                            alt="Cover Art" 
                            class="w-full h-full object-cover rounded-full animate-spin-slow paused shadow-inner border-4 border-black/80"
                        >
                        <!-- Vinyl Hole Center -->
                        <div class="absolute w-12 h-12 bg-black rounded-full border-4 border-gray-800 flex items-center justify-center shadow-lg">
                            <div class="w-4 h-4 bg-cyan-400 rounded-full"></div>
                        </div>
                    </div>
                </div>

                <!-- Track Info -->
                <div class="text-center mt-2 mb-4 w-full px-4">
                    <h2 id="trackTitle" class="text-xl font-bold text-white truncate max-w-full">โปรดเลือกเพลงหรือวางลิงก์ YouTube</h2>
                    <p id="trackArtist" class="text-sm text-cyan-400 font-medium mt-1">NeonWave Player</p>
                </div>

                <!-- Embedded YouTube Player Container (Hidden / Styled) -->
                <div class="w-full mb-4 rounded-xl overflow-hidden bg-black/60 border border-white/10">
                    <div class="relative w-full aspect-video">
                        <iframe 
                            id="ytPlayer" 
                            class="absolute top-0 left-0 w-full h-full"
                            src="https://www.youtube.com/embed/jfKfPfyJRdk?enablejsapi=1&autoplay=0" 
                            title="YouTube video player" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>

                <!-- Player Controls -->
                <div class="w-full flex items-center justify-center gap-6 mt-2">
                    <button id="prevBtn" class="text-gray-400 hover:text-cyan-400 transition text-lg p-2 active:scale-95">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="playPauseBtn" class="w-14 h-14 rounded-full bg-gradient-to-r from-cyan-400 to-purple-600 text-white text-xl flex items-center justify-center shadow-neon-glow hover:scale-105 active:scale-95 transition">
                        <i id="playIcon" class="fa-solid fa-play ml-0.5"></i>
                    </button>
                    <button id="nextBtn" class="text-gray-400 hover:text-cyan-400 transition text-lg p-2 active:scale-95">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>

            </div>
        </section>

        <!-- Playlist & Presets Section -->
        <section class="md:col-span-5 flex flex-col h-full">
            <div class="glass-panel w-full rounded-3xl p-5 flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-4 border-b border-white/10 pb-3">
                    <h3 class="font-bold text-lg text-white flex items-center gap-2">
                        <i class="fa-solid fa-list-ul text-cyan-400"></i> เพลงแนะนำ (Presets)
                    </h3>
                    <span id="playlistCount" class="text-xs text-gray-400 bg-white/10 px-2 py-1 rounded-full">4 เพลง</span>
                </div>

                <!-- Preset Tracks List -->
                <div id="playlistContainer" class="space-y-2 overflow-y-auto max-h-[420px] pr-1">
                    <!-- Items generated dynamically by JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center text-xs text-gray-500 mt-6">
        <p>© 2026 NeonWave Music Player • Powered by YouTube Iframe API & Tailwind CSS</p>
    </footer>

    <!-- Logic Script -->
    <script>
        // Preset Playlists
        const presets = [
            {
                id: 'jfKfPfyJRdk',
                title: 'Lofi Hip Hop Radio - Beats to Relax/Study',
                artist: 'Lofi Girl',
                cover: 'https://img.youtube.com/vi/jfKfPfyJRdk/hqdefault.jpg'
            },
            {
                id: 'TURbeLyAgGE',
                title: 'Synthwave Radio - Chill Retro Beats',
                artist: 'Lofi Girl Synthwave',
                cover: 'https://img.youtube.com/vi/TURbeLyAgGE/hqdefault.jpg'
            },
            {
                id: '4xDzrJKXOOY',
                title: 'synthwave / synthpop / chillwave mix',
                artist: 'Cyberpunk Aesthetic',
                cover: 'https://img.youtube.com/vi/4xDzrJKXOOY/hqdefault.jpg'
            },
            {
                id: '5qap5aO4i9A',
                title: 'Lofi Hip Hop - Beats to Chill',
                artist: 'ChilledCow Classic',
                cover: 'https://img.youtube.com/vi/5qap5aO4i9A/hqdefault.jpg'
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;

        // Elements
        const ytPlayer = document.getElementById('ytPlayer');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const trackCover = document.getElementById('trackCover');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const playlistContainer = document.getElementById('playlistContainer');

        // Extract Video ID from URL or Raw String
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url.trim();
        }

        // Render Playlist Preset Items
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            presets.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `flex items-center gap-3 p-2.5 rounded-xl cursor-pointer transition border ${
                    index === currentTrackIndex 
                        ? 'bg-cyan-500/20 border-cyan-500/40 text-cyan-300' 
                        : 'bg-black/30 border-white/5 hover:bg-white/10 text-gray-300'
                }`;
                item.onclick = () => loadTrackByIndex(index);

                item.innerHTML = `
                    <img src="${track.cover}" class="w-12 h-12 rounded-lg object-cover" alt="${track.title}">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-semibold truncate">${track.title}</h4>
                        <p class="text-xs text-gray-400 truncate">${track.artist}</p>
                    </div>
                    <div class="text-cyan-400 p-2">
                        <i class="fa-solid ${index === currentTrackIndex && isPlaying ? 'fa-volume-high' : 'fa-play'}"></i>
                    </div>
                `;
                playlistContainer.appendChild(item);
            });
        }

        // Load Track onto Iframe & UI
        function loadTrack(videoID, title = "YouTube Video Track", artist = "YouTube", cover = "") {
            const embedUrl = `https://www.youtube.com/embed/${videoID}?enablejsapi=1&autoplay=1`;
            ytPlayer.src = embedUrl;

            trackTitle.textContent = title;
            trackArtist.textContent = artist;
            trackCover.src = cover || `https://img.youtube.com/vi/${videoID}/hqdefault.jpg`;

            isPlaying = true;
            updatePlayButtonUI();
            renderPlaylist();
        }

        function loadTrackByIndex(index) {
            currentTrackIndex = index;
            const track = presets[index];
            loadTrack(track.id, track.title, track.artist, track.cover);
        }

        // Update Play/Pause UI state
        function updatePlayButtonUI() {
            if (isPlaying) {
                playIcon.className = 'fa-solid fa-pause';
                trackCover.classList.remove('paused');
            } else {
                playIcon.className = 'fa-solid fa-play ml-0.5';
                trackCover.classList.add('paused');
            }
        }

        // Handle Play/Pause Toggle
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            updatePlayButtonUI();
            
            // Post message to YouTube Iframe API
            const func = isPlaying ? 'playVideo' : 'pauseVideo';
            ytPlayer.contentWindow.postMessage(JSON.stringify({
                'event': 'command',
                'func': func,
                'args': []
            }), '*');
        });

        // Previous & Next Controls
        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + presets.length) % presets.length;
            loadTrackByIndex(currentTrackIndex);
        });

        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % presets.length;
            loadTrackByIndex(currentTrackIndex);
        });

        // Search/Submit Event
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value;
            if (!query) return;

            const videoID = extractVideoID(query);
            if (videoID) {
                currentTrackIndex = -1; // Deselect preset list
                loadTrack(videoID, `YouTube Track [${videoID}]`, "Custom URL", `https://img.youtube.com/vi/${videoID}/hqdefault.jpg`);
                searchInput.value = '';
            }
        });

        // Initialize App
        window.onload = () => {
            renderPlaylist();
        };
    </script>
</body>
</html>
