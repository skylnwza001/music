<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonWave Music Player</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0d17;
            background-image: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0b0d17 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(23, 27, 44, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #a78bfa;
            letter-spacing: 0.5px;
        }

        .search-box {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        .search-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 14px;
            padding: 14px 18px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
        }

        .btn-search {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 0 22px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        .vinyl-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 10px 0 25px 0;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #262626 18%, #111 19%, #111 24%, #262626 25%, #262626 38%, #111 39%, #111 46%, #262626 47%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 15s linear infinite;
            animation-play-state: paused;
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        .vinyl-cover {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #171b2c;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .player-card {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .iframe-container {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <i class="fa-solid fa-compact-disc"></i> NeonWave Player
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="urlInput" class="search-input" placeholder="วางลิงก์ YouTube (URL) หรือ ID วิดีโอ...">
        <button class="btn-search" onclick="loadYouTube()"><i class="fa-solid fa-play"></i> เล่น</button>
    </div>

    <div class="vinyl-wrapper">
        <div class="vinyl" id="vinylDisc">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&auto=format&fit=crop&q=80" alt="Cover" class="vinyl-cover" id="coverImg">
        </div>
    </div>

    <div class="player-card">
        <div class="iframe-container">
            <iframe id="ytPlayer" src="https://www.youtube.com/embed/guDJvZp5Bqk?enablejsapi=1" allow="autoplay"></iframe>
        </div>
    </div>
</div>

<script>
    function extractVideoId(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : url.trim();
    }

    function loadYouTube() {
        const input = document.getElementById('urlInput').value;
        const videoId = extractVideoId(input);
        
        if (videoId) {
            const player = document.getElementById('ytPlayer');
            player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
            
            // อัปเดตรูปปกแผ่นเสียงตาม ID ของ YouTube
            document.getElementById('coverImg').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            document.getElementById('vinylDisc').classList.add('playing');
        } else {
            alert('กรุณากรอกลิงก์หรือ ID วิดีโอ YouTube ที่ถูกต้อง');
        }
    }
</script>

</body>
</html>
